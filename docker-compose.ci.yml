# ============================================================================
# API SERVICE - MEF Core API Server
# ============================================================================
# Description: Main API server for MEF-Core operations
# Network: Connects to test-network for QA access and db-network for vector DB access
# Health: Checks /healthz endpoint every 5s with 60 retries
# Resources: Configurable via environment variables
# Restart: Automatically restarts on failure (max 3 attempts)
# ============================================================================
services:
  api:
    build:
      context: ./MEF-Core_v1.0
      dockerfile: Dockerfile
    profiles: ["compare"]
    networks:
      - test-network
      - db-network
    ports:
      - "8080:8080"
    environment:
      - BIND_HOST=0.0.0.0
      - PORT=8080
      - AUTH_TOKEN_REQUIRED=${AUTH_TOKEN_REQUIRED:-false}
      - MEF_API_TOKEN=${MEF_API_TOKEN:-}
      - QUALITY_TOKEN=${QUALITY_TOKEN:-}
      - QUALITY_BASE_URL=${QUALITY_BASE_URL:-http://localhost:8080}
      - CI_NO_POR_HOLDS=1
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-ci}
    # Resource limits for production stability
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-2.0}"
          memory: "${API_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "0.5"
          memory: "${API_MEMORY_RESERVATION:-512M}"
    # Health check configuration with robust retry logic
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 30s
    # Restart policy for production reliability
    restart: on-failure:3
    # Centralized logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=api,environment=${ENVIRONMENT:-ci}"

  # ============================================================================
  # QA CONTAINER - Test and Benchmark Execution
  # ============================================================================
  # Description: Python container that runs benchmark suite, recall evaluation,
  #              golden tests, and cross-DB comparisons
  # Network: Connects to test-network and db-network for service access
  # Dependencies: Waits for api, qdrant, and milvus to be healthy
  # Phase 0: Pre-flight connectivity verification from QA perspective
  # Phase 1: Python dependency installation
  # Phase 2: Pre-flight environment validation
  # Phase 3: Benchmark execution (bench_runner, recall_eval, golden, compare)
  # Resources: Configurable via environment variables
  # ============================================================================
  qa:
    image: python:3.11-slim
    profiles: ["compare"]
    networks:
      - test-network
      - db-network
    depends_on:
      api:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      milvus:
        condition: service_healthy
    working_dir: /work/MEF-Core_v1.0
    volumes:
      - ./:/work
    environment:
      - QUALITY_BASE_URL=${QUALITY_BASE_URL:-http://api:8080}
      - AUTH_TOKEN_REQUIRED=${AUTH_TOKEN_REQUIRED:-false}
      - QUALITY_TOKEN=${QUALITY_TOKEN:-}
      - BENCH_POINTS=${BENCH_POINTS:-100000}
      - BENCH_Q=${BENCH_Q:-200}
      - BENCH_K=${BENCH_K:-10}
      - UPSERT_BATCH=${UPSERT_BATCH:-2000}
      - BENCH_TIMEOUT_SECONDS=${BENCH_TIMEOUT_SECONDS:-1200}
      - RECALL_EFSEARCH=${RECALL_EFSEARCH:-128}
      - PYTHONPATH=/work/MEF-Core_v1.0:/work/MEF-Core_v1.0/src:/work/MEF-Core_v1.0/tools
      - CI_NO_POR_HOLDS=1
      - GOLDEN_STRICT=${GOLDEN_STRICT:-0}
      - GOLDEN_COUNT=${GOLDEN_COUNT:-30}
      - GOLDEN_MIN_OK=${GOLDEN_MIN_OK:-30}
      - GOLDEN_ATTEMPTS_PER_SAMPLE=${GOLDEN_ATTEMPTS_PER_SAMPLE:-10}
      - GOLDEN_ATTEMPTS_FACTOR=${GOLDEN_ATTEMPTS_FACTOR:-5}
      - GOLDEN_HOLD_POLICY=${GOLDEN_HOLD_POLICY:-}
      - GOLDEN_SEED=${GOLDEN_SEED:-1337}
      - BENCH_COMPARE=${BENCH_COMPARE:-1}
      - BENCH_TARGETS=${BENCH_TARGETS:-mef,faiss,qdrant,milvus}
      - TARGETS=${TARGETS:-mef,faiss,qdrant,milvus}
      - REQUIRED_TARGETS=${REQUIRED_TARGETS:-mef,faiss,qdrant}
      - COMPARE_LIMIT=${COMPARE_LIMIT:-500}
      - BENCH_CONNECT_TIMEOUT=${BENCH_CONNECT_TIMEOUT:-240}
      - BENCH_CONNECT_RETRY_DELAY=${BENCH_CONNECT_RETRY_DELAY:-2}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - MILVUS_HOST=${MILVUS_HOST:-milvus}
      - MILVUS_PORT=${MILVUS_PORT:-19530}
      - WEAVIATE_URL=${WEAVIATE_URL:-http://weaviate:8080}
      - ELASTIC_URL=${ELASTIC_URL:-http://elasticsearch:9200}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_ENV=${PINECONE_ENV:-}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT:-}
      - PINECONE_INDEX=${PINECONE_INDEX:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-ci}
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "${QA_CPU_LIMIT:-2.0}"
          memory: "${QA_MEMORY_LIMIT:-4G}"
        reservations:
          cpus: "1.0"
          memory: "${QA_MEMORY_RESERVATION:-1G}"
    # Restart policy (disabled for one-shot test container)
    restart: "no"
    # Centralized logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=qa,environment=${ENVIRONMENT:-ci}"
    command:
      - bash
      - -lc
      - |
            set -euo pipefail
            
            echo "==== Phase 0: Verify Service Connectivity ===="
            echo "Waiting for services to be reachable from QA container..."
            
            # Wait for API service
            echo -n "Checking API ($$QUALITY_BASE_URL)... "
            max_wait=60
            elapsed=0
            while ! curl -fsS "$${QUALITY_BASE_URL}/healthz" >/dev/null 2>&1; do
              if [ $$elapsed -ge $$max_wait ]; then
                echo "FAILED"
                echo "ERROR: API service at $$QUALITY_BASE_URL is not reachable after $${max_wait}s" >&2
                echo "This suggests a network connectivity issue between containers" >&2
                exit 1
              fi
              sleep 2
              elapsed=$$((elapsed + 2))
            done
            echo "OK ($${elapsed}s)"
            
            # Wait for Qdrant service
            echo -n "Checking Qdrant ($$QDRANT_URL)... "
            max_wait=60
            elapsed=0
            while ! curl -fsS "$${QDRANT_URL}/readyz" >/dev/null 2>&1; do
              if [ $$elapsed -ge $$max_wait ]; then
                echo "FAILED"
                echo "ERROR: Qdrant service at $$QDRANT_URL is not reachable after $${max_wait}s" >&2
                echo "Container health check may have passed but service is not actually ready" >&2
                exit 1
              fi
              sleep 2
              elapsed=$$((elapsed + 2))
            done
            echo "OK ($${elapsed}s)"
            
            # Wait for Milvus service (gRPC health check via Python)
            echo -n "Checking Milvus ($${MILVUS_HOST}:$${MILVUS_PORT})... "
            max_wait=60
            elapsed=0
            # Use a simple TCP connection test first
            while ! timeout 2 bash -c "cat < /dev/null > /dev/tcp/$${MILVUS_HOST}/$${MILVUS_PORT}" 2>/dev/null; do
              if [ $$elapsed -ge $$max_wait ]; then
                echo "FAILED"
                echo "ERROR: Milvus service at $${MILVUS_HOST}:$${MILVUS_PORT} is not reachable after $${max_wait}s" >&2
                echo "gRPC port is not accepting connections" >&2
                exit 1
              fi
              sleep 2
              elapsed=$$((elapsed + 2))
            done
            echo "OK ($${elapsed}s)"
            
            echo "✓ All services are reachable from QA container"
            echo ""
            
            echo "==== Phase 1: Install Dependencies ===="
            python -m pip -q install -U pip || {
              echo "ERROR: Failed to upgrade pip" >&2
              exit 1
            }
            pip -q install -r requirements.txt || {
              echo "ERROR: Failed to install requirements" >&2
              exit 1
            }
            
            echo ""
            echo "==== Phase 2: Run Pre-Flight Validation ===="
            python tests/bench/preflight_check.py || {
              echo "ERROR: Pre-flight validation failed" >&2
              echo "Please check the error messages above and fix configuration" >&2
              exit 1
            }
            
            echo ""
            echo "==== Phase 3: Execute Benchmark Suite ===="
            set +e
            set -o pipefail

            # Initialize status variables with explicit defaults
            bench_status=0
            recall_status=0
            golden_status=0
            compare_status=0
            
            echo "[1/4] Running bench_runner.py..."
            if ! python -u tests/bench/bench_runner.py; then
              bench_status=$$?
              echo "ERROR: bench_runner.py failed with exit code $$bench_status" >&2
            fi

            echo "[2/4] Running recall_eval.py..."
            if ! python -u tests/bench/recall_eval.py; then
              recall_status=$$?
              echo "ERROR: recall_eval.py failed with exit code $$recall_status" >&2
            fi

            echo "[3/4] Running golden tests..."
            if ! pytest -q tests/property/_golden_build.py; then
              golden_status=$$?
              echo "ERROR: Golden tests failed with exit code $$golden_status" >&2
            fi

            echo "[4/4] Running cross-DB compare benchmarks..."
            if ! python -u -m tests.bench.compare; then
              compare_status=$$?
              echo "ERROR: Compare benchmarks failed with exit code $$compare_status" >&2
            fi

            echo ""
            echo "==== Phase 4: Summary ===="
            # Determine overall exit code (use first non-zero, or highest if multiple failures)
            exit_code=0
            for code in "$$bench_status" "$$recall_status" "$$golden_status" "$$compare_status"; do
              # Ensure code is numeric and not empty (default to 0 if unset or empty)
              code="$${code:-0}"
              if [ "$${code}" -ne 0 ]; then
                if [ "$${exit_code}" -eq 0 ] || [ "$${code}" -gt "$${exit_code}" ]; then
                  exit_code="$${code}"
                fi
              fi
            done

            # Print summary
            printf "Benchmark Runner: %s\n" "$$([ "$${bench_status:-0}" -eq 0 ] && echo "✓ PASS" || echo "✗ FAIL ($${bench_status:-0})")"
            printf "Recall Evaluation: %s\n" "$$([ "$${recall_status:-0}" -eq 0 ] && echo "✓ PASS" || echo "✗ FAIL ($${recall_status:-0})")"
            printf "Golden Tests: %s\n" "$$([ "$${golden_status:-0}" -eq 0 ] && echo "✓ PASS" || echo "✗ FAIL ($${golden_status:-0})")"
            printf "Compare Benchmarks: %s\n" "$$([ "$${compare_status:-0}" -eq 0 ] && echo "✓ PASS" || echo "✗ FAIL ($${compare_status:-0})")"
            printf "Overall: %s\n" "$$([ "$${exit_code:-0}" -eq 0 ] && echo "✓ SUCCESS" || echo "✗ FAILURE ($${exit_code:-0})")"

            exit "$${exit_code}"

  # ============================================================================
  # FAISS-API SERVICE - HTTP API for FAISS Vector Database
  # ============================================================================
  # Description: HTTP wrapper for FAISS library allowing API-based vector operations
  # Network: Connects to test-network for QA access
  # Health: POST /clear endpoint check every 5s with 30 retries
  # Resources: Configurable via environment variables
  # Restart: Automatically restarts on failure (max 3 attempts)
  # ============================================================================
  faiss-api:
    build:
      context: ./MEF-Core_v1.0/bench/faiss_http
      dockerfile: Dockerfile
    profiles: ["compare-faiss"]
    networks:
      - test-network
    environment:
      - FAISS_METRIC=${FAISS_METRIC:-cosine}
      - FAISS_INDEX=${FAISS_INDEX:-flat}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-ci}
    ports:
      - "8090:8090"
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "${FAISS_CPU_LIMIT:-2.0}"
          memory: "${FAISS_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "0.5"
          memory: "${FAISS_MEMORY_RESERVATION:-512M}"
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-X", "POST", "http://localhost:8090/clear"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    # Restart policy
    restart: on-failure:3
    # Centralized logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=faiss-api,environment=${ENVIRONMENT:-ci}"

  # ============================================================================
  # QDRANT SERVICE - Vector Database
  # ============================================================================
  # Description: High-performance vector similarity search engine
  # Network: Connects to db-network for isolation from test network
  # Health: TCP connection check to port 6333 every 2s with 90 retries
  # Resources: Configurable via environment variables
  # Restart: Automatically restarts on failure (max 5 attempts)
  # Persistence: Optional volume mount for data persistence
  # ============================================================================
  qdrant:
    profiles: ["compare"]
    image: qdrant/qdrant:v1.8.3
    networks:
      - db-network
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "${QDRANT_CPU_LIMIT:-2.0}"
          memory: "${QDRANT_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "0.5"
          memory: "${QDRANT_MEMORY_RESERVATION:-512M}"
    # Health check using bash TCP test with /readyz endpoint verification
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 2 bash -c '</dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 20s
    ports:
      - "6333:6333"
    # Restart policy
    restart: on-failure:5
    # Centralized logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=qdrant,environment=${ENVIRONMENT:-ci}"
    # Optional: uncomment for data persistence
    # volumes:
    #   - qdrant-data:/qdrant/storage

  # ============================================================================
  # MILVUS SERVICE - Vector Database
  # ============================================================================
  # Description: Open-source vector database for similarity search and AI
  # Network: Connects to db-network for isolation from test network
  # Health: HTTP health check on port 9091 every 3s with 80 retries
  # Resources: Optimized for CI runners with CPU ≤2.0
  # Restart: Automatically restarts on failure (max 5 attempts)
  # Persistence: Optional volume mount for data persistence
  # ============================================================================
  milvus:
    profiles: ["compare"]
    image: milvusdb/milvus:v2.3.3
    command: ["milvus", "run", "standalone"]
    networks:
      - db-network
    environment:
      - ETCD_USE_EMBED=true
      - COMMON_STORAGETYPE=local
      - LOG_LEVEL=${LOG_LEVEL:-info}
    # Resource limits optimized for CI runners (CPU ≤2.0)
    deploy:
      resources:
        limits:
          cpus: "${MILVUS_CPU_LIMIT:-2.0}"
          memory: "${MILVUS_MEMORY_LIMIT:-3G}"
        reservations:
          cpus: "0.5"
          memory: "${MILVUS_MEMORY_RESERVATION:-512M}"
    # Health check using official health endpoint with robust retry logic
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9091/healthz"]
      interval: 3s
      timeout: 5s
      retries: 80
      start_period: 90s
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # HTTP/Metrics
    # Restart policy
    restart: on-failure:5
    # Centralized logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=milvus,environment=${ENVIRONMENT:-ci}"
    # Optional: uncomment for data persistence
    # volumes:
    #   - milvus-data:/var/lib/milvus


# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================
# Segmented networks for isolation and security:
# - test-network: For QA container to communicate with API and FAISS
# - db-network: For database services (Qdrant, Milvus) to communicate with API and QA
# This separation allows for better security policies and network isolation
# ============================================================================
networks:
  test-network:
    driver: bridge
    name: infinity-ledger-test
    ipam:
      config:
        - subnet: 172.20.0.0/16
  db-network:
    driver: bridge
    name: infinity-ledger-db
    ipam:
      config:
        - subnet: 172.21.0.0/16

# ============================================================================
# VOLUME CONFIGURATION (Optional - for data persistence)
# ============================================================================
# Uncomment these volumes and the corresponding volume mounts in services
# above to enable data persistence across container restarts
# ============================================================================
# volumes:
#   qdrant-data:
#     name: infinity-ledger-qdrant-data
#   milvus-data:
#     name: infinity-ledger-milvus-data


