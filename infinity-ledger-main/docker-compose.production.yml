# ============================================================================
# Docker Compose Configuration - Production/Staging Environment
# ============================================================================
# This configuration extends docker-compose.ci.yml with production-specific
# settings including monitoring, persistent storage, and enhanced security.
#
# Usage:
#   Development:   docker compose -f docker-compose.yml --profile dev up
#   Staging:       docker compose -f docker-compose.yml --profile staging up
#   Production:    docker compose -f docker-compose.yml --profile production up
#   With Monitoring: Add --profile monitoring to any of the above
#
# Environment variables should be set via .env file or external configuration
# ============================================================================

services:
  # ============================================================================
  # MONITORING SERVICES
  # ============================================================================
  
  # Prometheus - Metrics collection and monitoring
  prometheus:
    image: prom/prometheus:v2.45.0
    profiles: ["monitoring"]
    networks:
      - monitoring-network
      - test-network
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "256M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=prometheus,environment=${ENVIRONMENT:-production}"

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:10.0.0
    profiles: ["monitoring"]
    networks:
      - monitoring-network
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=grafana,environment=${ENVIRONMENT:-production}"

  # ============================================================================
  # PRODUCTION API SERVICE (with secrets support)
  # ============================================================================
  api-production:
    build:
      context: ./MEF-Core_v1.0
      dockerfile: Dockerfile
    profiles: ["production"]
    networks:
      - test-network
      - db-network
      - monitoring-network
    ports:
      - "8080:8080"
    environment:
      - BIND_HOST=0.0.0.0
      - PORT=8080
      - AUTH_TOKEN_REQUIRED=true
      - CI_NO_POR_HOLDS=0
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - METRICS_PORT=${METRICS_PORT:-9090}
    # Use Docker secrets in production
    secrets:
      - mef_api_token
      - quality_token
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-4.0}"
          memory: "${API_MEMORY_LIMIT:-4G}"
        reservations:
          cpus: "1.0"
          memory: "${API_MEMORY_RESERVATION:-1G}"
      replicas: ${API_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=api,environment=${ENVIRONMENT:-production}"

# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================
networks:
  test-network:
    driver: bridge
    name: infinity-ledger-test
    ipam:
      config:
        - subnet: 172.20.0.0/16
  
  db-network:
    driver: bridge
    name: infinity-ledger-db
    ipam:
      config:
        - subnet: 172.21.0.0/16
  
  monitoring-network:
    driver: bridge
    name: infinity-ledger-monitoring
    ipam:
      config:
        - subnet: 172.22.0.0/16

# ============================================================================
# VOLUME CONFIGURATION (Persistent Storage)
# ============================================================================
volumes:
  # Database volumes
  qdrant-data:
    name: infinity-ledger-qdrant-data
  milvus-data:
    name: infinity-ledger-milvus-data
  
  # Monitoring volumes
  prometheus-data:
    name: infinity-ledger-prometheus-data
  grafana-data:
    name: infinity-ledger-grafana-data

# ============================================================================
# SECRETS CONFIGURATION (Docker Secrets)
# ============================================================================
# In production, use Docker Swarm secrets or external secret management
# For local development, you can use file-based secrets:
#   echo "your-secret-token" | docker secret create mef_api_token -
# ============================================================================
secrets:
  mef_api_token:
    external: true
  quality_token:
    external: true
