syntax = "proto3";

package mef.vector.v1;

import "google/protobuf/struct.proto";

message VectorRecord {
  string collection = 1;
  string id = 2;
  repeated float values = 3;
  google.protobuf.Struct metadata = 4;
  int64 epoch = 5;
}

message CollectionUpdate {
  string collection = 1;
  uint32 upserted = 2;
  int64 epoch = 3;
}

message UpsertResult {
  repeated CollectionUpdate updates = 1;
}

message QueryRequest {
  string collection = 1;
  repeated float vector = 2;
  string vector_id = 3;
  uint32 top_k = 4;
}

message QueryResult {
  string id = 1;
  double score = 2;
  google.protobuf.Struct metadata = 3;
  int64 epoch = 4;
}

message QueryResponse {
  repeated QueryResult results = 1;
}

message DeleteRequest {
  string collection = 1;
  repeated string ids = 2;
  int64 epoch = 3;
}

message DeleteResult {
  uint32 deleted = 1;
}

message SealRequest {
  string collection = 1;
  int64 epoch = 2;
}

message SealResult {
  bool ok = 1;
  string path = 2;
}

message SwitchRequest {
  string collection = 1;
  int64 epoch = 2;
}

message SwitchResult {
  bool ok = 1;
}

service VectorService {
  rpc Upsert (stream VectorRecord) returns (UpsertResult);
  rpc Query (QueryRequest) returns (QueryResponse);
  rpc Delete (DeleteRequest) returns (DeleteResult);
  rpc Seal (SealRequest) returns (SealResult);
  rpc Switch (SwitchRequest) returns (SwitchResult);
}
