server:
  host: 0.0.0.0
  port: 8080
security:
  auth_token_required: ${AUTH_TOKEN_REQUIRED:false}
  cors_allow_origins: ["*"]
proofs:
  enabled: ${PROOFS_ENABLED:true}
index:
  provider: hnsw
paths:
  schemas_dir: "/app/schemas"
seed: "MEF_SEED_42"

spiral:
  r: 1.0
  a: 0.05
  b: 0.2
  c: 0.2
  k: 2
  step: 0.01

solvecoagula:
  lambda: 0.8
  eps: 1.0e-6
  max_iter: 1000

operators:
  dk: {alpha1: 0.05, alpha2: -0.03}
  sw: {tau: 0.5, beta: 0.1}
  pi: {canon: "lex", tol: 1.0e-6}
  wt: {gamma: 0.1, levels: ["micro","meso","macro"]}

gate:
  eps: 1.0e-6
  phi_star: 0.6
  mci_min: 0.85

ledger: {path: "/app/ledger"}
store:  {path: "/app/store"}
logs:   {path: "/app/logs"}
vector_store:
  path: "/app/vector_db"
  persistence:
    provider: null
    bucket: null
    prefix: null
