spec:
  id: SPEC-002
  title: "MEF-Core → Infinity Vector Ledger"
  version: "1.0.0"
  date: "2024-01-01"
  owners:
    - "Metatron Research Guild"
  goals:
    - "Deterministic ingestion across domains"
    - "Verifiable ledger commitments"
priorities:
  must:
    - "Ledger commits are reproducible"
    - "Proofs survive metadata volatility"
  should:
    - "Ingestion latencies under 250ms"
  could:
    - "Adaptive Merkaba thresholds"
components:
  - name: "Ingestion Gateway"
    type: "service"
    responsibilities:
      - "Normalise heterogeneous payloads"
      - "Emit deterministic feature vectors"
  - name: "Vector Index"
    type: "hnsw"
    deps:
      - "Ingestion Gateway"
    responsibilities:
      - "Serve k-NN queries"
  - name: "Ledger"
    type: "storage"
    deps:
      - "Vector Index"
    responsibilities:
      - "Persist immutable proofs"
storage:
  fs_root: "/var/lib/mef"
  s3:
    bucket: "mef-golden-artifacts"
    prefix: "v1/"
  layout:
    snapshots: "snapshots/"
    tics: "tics/"
    proofs: "proofs/"
distance:
  metric: "cosine"
  normalization: "l2"
schemas:
  snapshot: "schemas/snapshot.json"
  tic: "schemas/tic.json"
  proof: "schemas/proof.json"
api:
  rest:
    - "POST /acquisition"
    - "POST /search"
    - "GET /tic/{tic_id}"
  grpc:
    endpoint: "localhost:9000"
    tls: false
index_backends:
  hnsw:
    max_elements: 100000
    m: 32
    ef_construction: 200
    distance: "cosine"
  faiss:
    factory: "IVF1024,Flat"
    metric: "cosine"
consistency:
  commit_root: "sha256"
  ledger: "merkaba-ledger"
merkaba_gate:
  graph: "merkaba/graph.json"
  on_fail: "quarantine"
workflows:
  upsert:
    steps:
      - "triton.normalize"
      - "spiral.snapshot"
      - "solvecoagula.iterate"
      - "ledger.append"
  query:
    steps:
      - "vector.search"
      - "proofs.verify"
  rebuild:
    trigger: "daily"
    steps:
      - "index.rebuild"
      - "ledger.audit"
security:
  auth: "bearer"
  audit_log: true
observability:
  metrics: "prometheus"
  tracing: "otlp"
config:
  env:
    MEF_SEED: "MEF_SEED_42"
    PYTHONHASHSEED: "0"
  defaults:
    top_k: 10
    ef_search: 128
